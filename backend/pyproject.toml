[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-group-permission-aware-rag-wiki"
version = "0.1.0"
description = "Wiki thông minh có phân quyền (Permission-aware RAG) cho A Group"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "psycopg[binary,pool]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "openfga-sdk>=0.9",
  "pyyaml>=6.0",
  "google-genai>=1.0",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
# Cài ở bước ingest (nặng, kéo theo torch): pip install -e ".[ml]"
ml = [
  "FlagEmbedding>=1.2",
  "python-frontmatter>=1.1",
  "pyvi>=0.1.1",      # tách từ tiếng Việt cho BM25
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100